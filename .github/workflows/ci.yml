name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -p no:cacheprovider --cov --cov-report=term

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clusterx
          POSTGRES_PASSWORD: clusterx
          POSTGRES_DB: clusterx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clusterx -d clusterx_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://clusterx:clusterx@localhost:5432/clusterx_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -p no:cacheprovider

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build==1.6.1
      - run: python -m build
      - name: Install the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/clusterx-os --help
          APP_ENV=development /tmp/wheel-venv/bin/clusterx-os check-config

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t clusterx-os:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name cx -p 8005:8005 clusterx-os:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8005/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8005/readyz
          curl -fsS -o /dev/null http://127.0.0.1:8005/login
          docker exec cx id -u | grep -qx 10001
          docker exec cx clusterx-os check-config
      - if: failure()
        run: docker logs cx || true
