# Production-style stack: Postgres + API + background worker.
#   cp .env.example .env   # optional in development; set SECRET_KEY, WEBHOOK_API_KEY,
#                          # ADMIN_PASSWORD and APP_ENV=production for real use
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clusterx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clusterx}
      POSTGRES_DB: clusterx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clusterx -d clusterx"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: ["clusterx-os", "migrate"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://clusterx:${POSTGRES_PASSWORD:-clusterx}@db:5432/clusterx
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "${PORT:-8005}:8005"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8005"
      AUTO_MIGRATE: "0"
      RUN_SCHEDULER: "0"
      DATABASE_URL: postgresql+psycopg2://clusterx:${POSTGRES_PASSWORD:-clusterx}@db:5432/clusterx
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["clusterx-os", "worker"]
    env_file:
      - path: .env
        required: false
    environment:
      AUTO_MIGRATE: "0"
      DATABASE_URL: postgresql+psycopg2://clusterx:${POSTGRES_PASSWORD:-clusterx}@db:5432/clusterx
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  pgdata:
