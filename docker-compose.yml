services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: clusterx
      POSTGRES_PASSWORD: clusterx
      POSTGRES_DB: clusterx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clusterx"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "${PORT:-8005}:${PORT:-8005}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://clusterx:clusterx@db:5432/clusterx
      PORT: ${PORT:-8005}
      SEED_ON_STARTUP: "1"
    volumes:
      - ./data:/srv/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
