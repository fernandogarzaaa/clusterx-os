<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ClusterX{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-stone-100 text-stone-900">
<div class="flex min-h-screen">
  <aside class="w-60 shrink-0 bg-white border-r border-stone-200 flex flex-col">
    <div class="px-5 py-4 border-b border-stone-200">
      <div class="text-lg font-bold tracking-tight">
        <span class="text-orange-600">&#9632;</span> {{ app_name | default('ClusterX') }}
      </div>
      <div class="text-xs text-stone-500">beta</div>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1 text-sm">
      {% block nav %}{% endblock %}
    </nav>
    <div class="px-5 py-4 border-t border-stone-200 text-xs text-stone-500">
      {% if user %}{{ user.email }}<br><a href="/logout" class="text-orange-600 hover:underline">Sign out</a>{% endif %}
    </div>
  </aside>
  <main class="flex-1 min-w-0">
    <div class="max-w-7xl mx-auto px-6 py-6">
      {% block content %}{% endblock %}
    </div>
  </main>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
